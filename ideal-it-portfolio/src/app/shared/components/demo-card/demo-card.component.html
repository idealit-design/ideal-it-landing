<article
  class="group relative flex min-h-[390px] flex-col overflow-hidden rounded-2xl border border-white/[0.08] bg-panel/80 p-6 shadow-[0_16px_50px_-30px_rgba(0,0,0,0.8)] transition duration-300 hover:-translate-y-1 hover:border-accent/35 hover:bg-[#131e30] sm:p-7"
  [ngClass]="isLive ? 'ring-1 ring-accent/20' : ''"
>
  <div
    class="pointer-events-none absolute -right-20 -top-24 h-52 w-52 rounded-full bg-accent/[0.07] blur-3xl transition duration-300 group-hover:bg-accent/[0.12]"
    aria-hidden="true"
  ></div>

  <div class="relative flex items-start justify-between gap-4">
    <span
      class="grid h-12 w-12 place-items-center rounded-xl border border-white/10 bg-white/[0.04] text-lg font-semibold text-accent"
      aria-hidden="true"
    >
      {{ demo.title.slice(0, 1) }}
    </span>
    <span
      class="inline-flex items-center gap-2 rounded-full border px-3 py-1.5 text-[11px] font-medium tracking-wide"
      [ngClass]="isLive
        ? 'border-accent/20 bg-accent/[0.08] text-accent'
        : isComingSoon
          ? 'border-white/[0.06] bg-white/[0.02] text-slate-500'
          : isPlanned
            ? 'border-amber-300/15 bg-amber-300/[0.06] text-amber-200'
            : 'border-sky-300/15 bg-sky-300/[0.06] text-sky-200'"
    >
      @if (isLive) {
        <span class="h-1.5 w-1.5 animate-pulse rounded-full bg-accent"></span>
      }
      {{ statusLabel }}
    </span>
  </div>

  <div class="relative mt-8">
    <p class="mb-2 text-[11px] font-semibold uppercase tracking-[0.18em] text-slate-500">
      {{ demo.category }}
    </p>
    <h2 class="text-xl font-semibold leading-snug tracking-tight text-white sm:text-[22px]">
      {{ demo.title }}
    </h2>
    <p class="mt-3 text-sm leading-6 text-slate-400">{{ demo.summary }}</p>
  </div>

  <div class="relative mt-auto pt-7">
    <div class="flex flex-wrap gap-2" aria-label="Tecnologías">
      @for (technology of demo.technologies; track technology) {
        <span
          class="rounded-md border border-white/[0.07] bg-white/[0.03] px-2.5 py-1 text-[11px] font-medium text-slate-400"
        >
          {{ technology }}
        </span>
      }
    </div>
    @if (categoryHref) {
      <a
        class="mt-4 inline-flex min-h-9 items-center gap-2 text-xs font-semibold text-accent transition hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
        [routerLink]="categoryHref"
        [attr.aria-label]="'Explorar categoría de ' + demo.title"
      >
        Explorar categoría
        <span aria-hidden="true">→</span>
      </a>
    }
    <button
      type="button"
      class="mt-6 inline-flex min-h-11 w-full items-center justify-between rounded-lg border px-4 text-sm font-semibold transition duration-200 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
      [disabled]="isComingSoon"
      [ngClass]="isLive
        ? 'border-accent/30 bg-accent text-ink hover:bg-[#8bf0df]'
        : isComingSoon
          ? 'cursor-not-allowed border-white/[0.06] bg-white/[0.02] text-slate-500'
          : 'border-white/10 bg-white/[0.03] text-slate-200 hover:border-accent/30 hover:bg-accent/[0.08]'"
      (click)="selectDemo()"
    >
      <span>{{ actionLabel }}</span>
      @if (!isComingSoon) {
        <span class="text-base transition-transform group-hover:translate-x-1" aria-hidden="true">→</span>
      }
    </button>
  </div>
</article>
